<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery Cart</title>
    <style>
      :root { color-scheme: light; }
      body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
      .app { max-width: 920px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }
      .panel { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
      h1, h2 { margin: 0 0 10px; }
      .controls { display: grid; gap: 10px; grid-template-columns: 1.2fr 0.7fr 0.4fr; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
      input, button { font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid #d1d5db; }
      button { background: #2563eb; color: white; border: none; cursor: pointer; }
      .secondary { background: #e5e7eb; color: #111827; }
      .list { display: grid; gap: 10px; }
      .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1px solid #e5e7eb; border-radius: 14px; }
      .qty { display: flex; align-items: center; gap: 8px; }
      .qty button { padding: 6px 10px; border-radius: 999px; }
      .receipt { display: grid; gap: 8px; }
      .row { display: flex; justify-content: space-between; }
      .total { font-size: 1.2rem; font-weight: 700; }
      @media (max-width: 700px) { .controls { grid-template-columns: 1fr; } .app { padding: 12px; } }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="panel">
        <h1>Grocery Cart</h1>
        <p>Add items, set quantities, and keep a running total for your shopping trip.</p>
        <div class="controls">
          <input id="itemName" placeholder="Item name" />
          <input id="itemPrice" type="number" step="0.01" placeholder="Price" />
          <button id="addBtn">Add</button>
        </div>
        <div class="actions">
          <button id="clearBtn" class="secondary" type="button">Clear list</button>
        </div>
      </section>
      <section class="panel">
        <h2>Your list</h2>
        <div id="list" class="list"></div>
      </section>
      <section class="panel">
        <h2>Receipt</h2>
        <div id="receipt" class="receipt"></div>
      </section>
    </div>
    <script src="/src/app.js"></script>
  </body>
</html>
