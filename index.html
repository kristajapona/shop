<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Grocery Cart</title>
    <style>
      :root { color-scheme: light; }
      body { font-family: Arial, sans-serif; margin: 0; background: linear-gradient(135deg, #f8fafc, #e2e8f0); color: #1f2937; }
      .app { max-width: 980px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }
      .panel { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
      h1, h2, h3 { margin: 0 0 10px; }
      .controls { display: grid; gap: 10px; grid-template-columns: 1.2fr 0.7fr 0.9fr 0.6fr 0.6fr; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
      input, select, button { font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid #d1d5db; }
      button { background: #2563eb; color: white; border: none; cursor: pointer; }
      .secondary { background: #e5e7eb; color: #111827; }
      .catalog { display: grid; gap: 14px; }
      .category-card { border: 1px solid #e5e7eb; border-radius: 16px; padding: 14px; background: #f8fafc; }
      .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e5e7eb; gap: 10px; }
      .item-row:last-child { border-bottom: none; }
      .item-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .small-input { width: 90px; padding: 8px; border-radius: 8px; }
      .cart-list { display: grid; gap: 10px; }
      .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1px solid #e5e7eb; border-radius: 14px; gap: 10px; }
      .qty { display: flex; align-items: center; gap: 8px; }
      .qty button { padding: 6px 10px; border-radius: 999px; }
      .shopping-list-area { display: grid; gap: 10px; max-height: 360px; overflow-y: auto; padding-right: 4px; }
      .receipt { display: grid; gap: 10px; padding: 14px; border: 1px solid #e5e7eb; border-radius: 16px; background: #f8fafc; margin-top: 8px; position: sticky; bottom: 0; z-index: 5; }
      .row { display: flex; justify-content: space-between; padding: 4px 0; }
      .divider { border-top: 1px dashed #cbd5e1; margin: 4px 0; }
      .total { font-size: 1.2rem; font-weight: 700; color: #065f46; }
      .muted { color: #6b7280; font-size: 0.95rem; }
      @media (max-width: 700px) { .controls { grid-template-columns: 1fr; } .app { padding: 12px; } .item-row, .cart-item { flex-direction: column; align-items: flex-start; } }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="panel">
        <h1>Grocery Cart</h1>
        <p>Add grocery items by category, then tap “Add to cart” while you shop.</p>
        <div class="controls">
          <input id="itemName" placeholder="Item name" />
          <input id="itemPrice" type="number" step="0.01" min="0" placeholder="Price" />
          <select id="itemCategory">
            <option value="Dairy">Dairy</option>
            <option value="Canned Goods">Canned Goods</option>
            <option value="Others">Others</option>
          </select>
          <input id="newCategory" placeholder="New category" />
          <button id="addBtn">Add item</button>
        </div>
        <div class="actions">
          <button id="clearBtn" class="secondary" type="button">Clear cart</button>
        </div>
      </section>

      <section class="panel">
        <h2>Grocery categories</h2>
        <div id="catalog" class="catalog"></div>
      </section>

      <section class="panel">
        <h2>Shopping list</h2>
        <div class="shopping-list-area">
          <div id="cartList" class="cart-list"></div>
          <div id="receipt" class="receipt"></div>
        </div>
      </section>
    </div>
    <script src="/src/app.js"></script>
  </body>
</html>
